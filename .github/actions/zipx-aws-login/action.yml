name: zipx AWS login
description: Assume an AWS role via OIDC and optionally log in to ECR. Generated by zipx; do not edit by hand.
inputs:
  role-env:
    description: Env var holding the role ARN
    required: "false"
    default: AWS_ROLE_TO_ASSUME
  region-env:
    description: Env var holding the AWS region
    required: "false"
    default: AWS_REGION
  account-env:
    description: Env var holding the 12-digit account id for ECR
    required: "false"
    default: AWS_ACCOUNT_ID
  login-ecr:
    description: When true, also run amazon-ecr-login
    required: "false"
    default: "true"
  name-suffix:
    description: Optional label suffix for step names
    required: "false"
    default: ""
runs:
  using: composite
  steps:
    - name: Assume AWS role (OIDC)
      uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
      with:
        role-to-assume: ${{ env[inputs.role-env] }}
        aws-region: ${{ env[inputs.region-env] }}
    - name: Log in to ECR
      if: inputs.login-ecr == 'true'
      uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2.1.6
      with:
        registries: ${{ env[inputs.account-env] }}
