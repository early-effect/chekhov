# Generated by zipx — do not edit. Run 'sbt zipxWorkflowGenerate' to regenerate.
name: CI
"on":
  push:
    branches:
      - main
    tags:
      - v[0-9]+.[0-9]+.[0-9]+
  pull_request: null
  workflow_dispatch: null
concurrency:
  group: CI-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  verify-gate:
    name: verify-gate
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
      pull-requests: read
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/target/ms-playwright
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - name: Skip Verify after merged PR push
        id: check
        run: |
          # Commits landed by merging/squashing a PR are associated with that PR via the API.
          prs=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" \
            --jq "[.[] | select(.merged_at != null and .base.ref == \"${{ github.ref_name }}\")] | length")
          if [ "$prs" -gt 0 ]; then
            echo "Merged PR push — skipping redundant Verify (already ran on the PR)"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
  cache-rehydrate:
    name: cache-rehydrate
    runs-on: ubuntu-latest
    needs:
      - verify-gate
    if: needs.verify-gate.result == 'success' && needs.verify-gate.outputs.run == 'false'
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/target/ms-playwright
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: "0"
          fetch-tags: "true"
      - name: Setup JDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "25"
      - uses: sbt/setup-sbt@bfea3c5f48abd221b04a6df4798aa5eb8b6a2baf # v1.5.6
        with:
          disk-cache: "false"
      - name: Resolve cache epoch
        id: cache-epoch
        run: |
          set -euo pipefail
          tag_match='v*'
          if git remote get-url origin >/dev/null 2>&1; then
            remote_count=$(git ls-remote --tags --refs origin "$tag_match" 2>/dev/null | wc -l | tr -d ' ')
            local_count=$(git tag -l "$tag_match" | wc -l | tr -d ' ')
            if [ "$remote_count" -gt 0 ] && [ "$local_count" -lt "$remote_count" ]; then
              echo "::warning title=zipx cache epoch::Local tags ($local_count) fewer than origin ($remote_count). Epoch may be stale; checkout must use fetch-depth: 0 and fetch-tags: true."
            fi
          fi
          if [[ "${GITHUB_REF:-}" == refs/tags/v* ]]; then
            release="${GITHUB_REF#refs/tags/v}"
            epoch="$release"
          elif tag=$(git describe --tags --abbrev=0 --match "$tag_match" 2>/dev/null); then
            release="${tag#v}"
            epoch="${release}-ci"
          else
            echo "::warning title=zipx cache epoch::No tags matching '$tag_match' found; using epoch 0.0.0."
            release="0.0.0"
            epoch="0.0.0"
          fi
          echo "epoch=$epoch" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"

      - name: Cache sbt
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.sbt
            ~/.cache/sbt
            ~/.cache/coursier
            target
          key: ubuntu-latest-jdk25-sbt-${{ steps.cache-epoch.outputs.epoch }}-${{ github.run_id }}-cache-rehydrate
          restore-keys: |
            ubuntu-latest-jdk25-sbt-${{ steps.cache-epoch.outputs.epoch }}-${{ github.run_id }}-
            ubuntu-latest-jdk25-sbt-${{ steps.cache-epoch.outputs.epoch }}-
            ubuntu-latest-jdk25-sbt-${{ steps.cache-epoch.outputs.release }}-
            ubuntu-latest-jdk25-sbt-
      - name: Cache Playwright apt packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/chekhov-apt-archives
          key: ${{ runner.os }}-chekhov-apt-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-chekhov-apt-
      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "24"
          cache: npm
      - name: npm ci
        run: npm ci
      - name: npm ci (vite fixture)
        run: npm ci --prefix examples/vite-fixture
      - name: npm ci (ascent fixture)
        run: npm ci --prefix examples/ascent-fixture
      - name: Install Playwright browsers
        run: |
          set -euo pipefail
          apt_mirror="${HOME}/.cache/chekhov-apt-archives"
          mkdir -p "${apt_mirror}"
          sudo mkdir -p /var/cache/apt/archives/partial
          if ls "${apt_mirror}"/*.deb >/dev/null 2>&1; then
            echo "Seeding apt archives from ${apt_mirror} ($(ls -1 "${apt_mirror}"/*.deb | wc -l | tr -d ' ') debs)"
            sudo cp -n "${apt_mirror}"/*.deb /var/cache/apt/archives/ || true
          fi
          mkdir -p "${PLAYWRIGHT_BROWSERS_PATH}"
          chmod +x ./scripts/install-browsers.sh
          ./scripts/install-browsers.sh chromium chromium-headless-shell firefox webkit
          if ls /var/cache/apt/archives/*.deb >/dev/null 2>&1; then
            sudo cp -n /var/cache/apt/archives/*.deb "${apt_mirror}/" || true
            sudo chown -R "$(id -u):$(id -g)" "${apt_mirror}"
            echo "Apt mirror now has $(ls -1 "${apt_mirror}"/*.deb | wc -l | tr -d ' ') debs"
          fi
          echo "Playwright $(node -p "require('playwright/package.json').version") browsers ready"

      - name: cache-rehydrate
        run: sbt 'compile'
