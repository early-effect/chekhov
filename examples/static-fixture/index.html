<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Chekhov Fixture</title>
  </head>
  <body>
    <h1>Chekhov</h1>
    <input id="todo" data-testid="todo" placeholder="What needs to be done?" />
    <button id="add" data-testid="add" type="button">Add</button>
    <ul id="list" data-testid="list"></ul>
    <script>
      const input = document.getElementById("todo");
      const list = document.getElementById("list");
      document.getElementById("add").addEventListener("click", () => {
        const li = document.createElement("li");
        li.setAttribute("role", "listitem");
        li.textContent = input.value;
        list.appendChild(li);
        input.value = "";
      });
      input.addEventListener("keydown", (e) => {
        if (e.key === "Enter") document.getElementById("add").click();
      });
    </script>
  </body>
</html>
